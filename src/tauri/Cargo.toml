[package]
name = "wordsmith"
version = "1.0.0"
description = "wordsmith by DOGS: notes and feature requests your AI agents ship."
authors = ["DOGS"]
edition = "2021"

[lib]
name = "wordsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens OAuth sign-in in the system browser: Google and Apple refuse to sign in inside embedded WebViews.
tauri-plugin-opener = "2"
