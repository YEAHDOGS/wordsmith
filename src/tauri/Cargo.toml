[package]
name = "wordsmith"
version = "1.0.0"
description = "wordsmith by DOGS: notes and feature requests your AI agents ship."
authors = ["DOGS"]
edition = "2021"

[lib]
name = "wordsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens OAuth sign-in in the system browser: Google and Apple refuse to sign in inside embedded WebViews.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# Already in the tree through Tauri. tauri::generate_context! reads plugin settings (the updater's) with it on every
# platform; the speech engine reads its model catalog with it.
serde_json = "1"

# Local speech-to-text (src/speech/), desktop only for now: phones need their own native builds of the engine.
# transcribe-cpp: the ggml speech engine (60+ models, MIT), compiled from source by CMake; no smaller library runs
# these models. Keep its version in step with TRANSCRIBE_CPP_VERSION in scripts/speech-catalog.js.
# sha2 (already in the tree through Tauri) checks each downloaded model file against the catalog built into the app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false }
sha2 = "0.10"
# In-app updates (src/updates.rs): downloads a signed newer release and installs it on restart. Desktop only: phones
# update through a new APK (src/lib/updates.svelte.js).
tauri-plugin-updater = "2"
# Tapes (src/tapes/): shrinking voice recordings before they upload. symphonia decodes what phone recorders save
# (MP3 first, also M4A/AAC, WAV, FLAC, Ogg Vorbis) in pure Rust; opus encodes libopus (compiled from source by
# CMake, like the speech engine), the codec built for voice: a fifth of a 128 kbps MP3 and still clear. The browser's
# own encoder (WebCodecs) can't stream an hour-long file through without holding all of it in memory.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis"] }
opus = "0.4"

# Apple GPUs through Metal. Windows and Linux run on the CPU until their builds carry the Vulkan SDK
# (the speech-vulkan feature below).
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[features]
# GPU speech on Windows and Linux. Needs the Vulkan SDK on the build machine.
speech-vulkan = ["transcribe-cpp/vulkan"]

# The speech engine is unusably slow unoptimized, so it is always built for speed, dev builds included.
[profile.dev.package.transcribe-cpp-sys]
opt-level = 3
