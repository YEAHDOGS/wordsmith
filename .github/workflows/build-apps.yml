name: Build apps

# Manual only: Actions → Build apps → Run workflow, then tick the platforms you want.
# Every platform's installers land in one "build" artifact per platform, named like build/wordsmith-win-x64.exe.
# Tick "release" to also publish them as a GitHub release tagged v<app version>; the app's Settings → Install app reads it.
on:
  workflow_dispatch:
    inputs:
      web:
        description: Web (dist)
        type: boolean
        default: true
      windows:
        description: Windows (wordsmith-win-x64.exe / .msi)
        type: boolean
        default: true
      macos:
        description: macOS (wordsmith-mac-universal.dmg)
        type: boolean
        default: true
      linux:
        description: Linux (wordsmith-linux-x64.AppImage / .deb / .rpm)
        type: boolean
        default: true
      android:
        description: Android (wordsmith-android.apk)
        type: boolean
        default: false
      ios:
        description: iOS (wordsmith-ios.ipa, needs Apple signing set up)
        type: boolean
        default: false
      api_base:
        description: API origin native apps call, e.g. https://wordsmith.dogs.red (blank = repo variable WORDSMITH_API_BASE)
        type: string
        default: ''
      release:
        description: Publish a GitHub release (tag v<app version>) with every installer built above. Settings → Install app downloads from the latest one.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          node -e '
            const inputs = JSON.parse(process.env.INPUTS);
            const all = [
              { platform: "windows", os: "windows-latest", args: "--bundles msi,nsis", mobile: "" },
              { platform: "linux", os: "ubuntu-24.04", args: "--bundles deb,rpm,appimage", mobile: "" },
              { platform: "macos", os: "macos-15", args: "--target universal-apple-darwin --bundles dmg", mobile: "" },
              { platform: "android", os: "ubuntu-24.04", args: "--apk", mobile: "android" },
              { platform: "ios", os: "macos-15", args: "", mobile: "ios" },
            ];
            const picked = all.filter((entry) => inputs[entry.platform] === true || inputs[entry.platform] === "true");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(picked)}\n`);
            console.log("Building:", picked.map((entry) => entry.platform).join(", ") || "no native targets");
          '

  web:
    name: Web
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist
          if-no-files-found: error

  native:
    name: ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Native bundles have no same-origin API; this is baked in at build time (it is a public URL, not a secret).
      VITE_API_BASE: ${{ inputs.api_base || vars.WORDSMITH_API_BASE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Android Rust targets
        if: matrix.platform == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install iOS Rust targets
        if: matrix.platform == 'ios'
        run: rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install Android tools
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
      - name: Initialize mobile project
        if: matrix.platform == 'android' || matrix.platform == 'ios'
        run: npx tauri ${{ matrix.platform }} init
      - name: Build native app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}
      - name: Collect into build/
        run: node scripts/collect-builds.js ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/*
          if-no-files-found: error

  # Optional: gathers every platform's build/ files into one GitHub release tagged with the app version
  # (scripts/version.js, e.g. v1.0.0.02). Runs when at least one native build succeeded; failed platforms are skipped.
  release:
    name: Release
    needs: [plan, native]
    if: ${{ !cancelled() && inputs.release && needs.plan.outputs.matrix != '[]' && contains(fromJSON('["success","failure"]'), needs.native.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the version falls back to counting merges if the GitHub API is unreachable
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Native artifacts only: the web artifact (dist/) holds index.html and an assets/ folder, which are not installers
      - uses: actions/download-artifact@v8
        with:
          path: build
          pattern: '{windows,linux,macos,android,ios}'
          merge-multiple: true
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in build/wordsmith-*; do [ -f "$f" ] && files+=("$f"); done
          if [ ${#files[@]} -eq 0 ]; then echo "No installers were built; nothing to release."; exit 1; fi
          version=$(node -e 'import("./scripts/version.js").then(async (m) => console.log((await m.readVersion()).version))')
          case "$version" in *.dev) echo "Could not work out the app version; not releasing."; exit 1;; esac
          tag="v${version}"
          echo "Releasing ${tag} with: ${files[*]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "wordsmith ${version}" --generate-notes --latest
          fi
