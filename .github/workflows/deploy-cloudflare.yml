name: Deploy Cloudflare environments

# Manual only for now: nothing deploys on push. Actions → Deploy Cloudflare environments → Run workflow,
# pick the branch, then the environment. Production only deploys from master.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PROJECT_NAME: wordsmith
  # Staging never deploys as master (that is the Pages production branch); from master it uses the alias "staging".
  DEPLOY_BRANCH: ${{ github.ref_name == 'master' && 'staging' || github.ref_name }}

jobs:
  deploy:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging preview' }}
    if: inputs.environment == 'staging' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Apply staging D1 migrations
        if: inputs.environment == 'staging'
        working-directory: api
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-staging" --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production D1 migrations
        if: inputs.environment == 'production'
        working-directory: api
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-production" --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        working-directory: api
        # Staging deploys under the branch name (a preview URL); production deploys as master.
        run: npx --yes wrangler pages deploy ../dist --project-name "$PROJECT_NAME" --branch "${{ inputs.environment == 'production' && 'master' || env.DEPLOY_BRANCH }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
