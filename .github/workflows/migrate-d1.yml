name: Migrate Cloudflare D1

# Manual only: applies SQL migrations to staging or production D1. Deploys come from Workers Builds
# (master -> the wordsmith Worker). Migrations are additive, so run them on staging,
# then production, BEFORE pushing code that needs them. Production only migrates from master.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to migrate
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cloudflare-migrate-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PROJECT_NAME: wordsmith

jobs:
  migrate:
    name: ${{ inputs.environment == 'production' && 'Production D1' || 'Staging D1' }}
    if: inputs.environment == 'staging' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Apply staging D1 migrations
        if: inputs.environment == 'staging'
        working-directory: api
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-staging" --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production D1 migrations
        if: inputs.environment == 'production'
        working-directory: api
        run: npx --yes wrangler d1 migrations apply "$PROJECT_NAME-production" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
